<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country School Visiting Team Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a paper ledger. Left rail of views, one reading column, hairline rules, a single warm accent for anything that needs a hand. */
:root{
  color-scheme: light;
  --paper:#f6f3ea; --sheet:#fbf9f3; --ink:#26241f; --muted:#6f6a5e; --rule:#d9d3c3;
  --accent:#b4532a; --accent-soft:#f1e2d6;
  --ok:#3f6b4a; --warn:#9a6b12; --ok-soft:#e3ecdf; --warn-soft:#f3e9cf;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
a{color:var(--accent)}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:0 40px;padding:0 20px}
header.top{grid-column:1/-1;border-bottom:1px solid var(--ink);padding:26px 0 14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between}
header.top h1{font-size:28px;font-weight:500;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.who{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
nav{padding:22px 0;position:sticky;top:0;align-self:start}
nav a{display:block;padding:5px 0 5px 10px;border-left:2px solid transparent;color:var(--ink);text-decoration:none;font-size:15.5px}
nav a:hover{color:var(--accent)}
nav a.on{border-left-color:var(--accent);color:var(--accent)}
nav .grp{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px 10px}
main{padding:22px 0 80px;min-width:0}
h2{font-size:25px;font-weight:500;margin:0 0 4px;text-wrap:balance}
h3{font-size:19px;font-weight:600;margin:30px 0 6px;padding-top:14px;border-top:1px solid var(--rule)}
h4{font-size:16px;font-weight:600;margin:18px 0 4px}
p{margin:0 0 10px;max-width:68ch}
.lede{color:var(--muted);max-width:68ch;margin-bottom:18px}
.small{font-size:14px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
#banner{grid-column:1/-1;font-family:var(--mono);font-size:12px;padding:7px 10px;margin-top:10px;background:var(--warn-soft);color:var(--warn);border:1px solid var(--rule)}
#banner:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--rule);background:var(--sheet);margin:14px 0 6px}
.tile{padding:12px 14px;border-right:1px solid var(--rule)}
.tile:last-child{border-right:0}
.tile b{display:block;font-size:26px;font-weight:500;line-height:1.1}
.tile span{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tblwrap{overflow-x:auto}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:400;padding:6px 8px 6px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr.sec td{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding-top:16px;border-bottom:1px solid var(--rule)}
.tbl tr.na td{color:var(--muted)}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 7px;border:1px solid var(--rule);border-radius:10px;white-space:nowrap;background:var(--sheet);color:var(--muted)}
.pill.go{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pill.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.fld{margin:14px 0 20px}
.fld>label,.lbl{display:block;font-weight:600;font-size:16px;margin-bottom:2px}
.fld .row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:4px}
textarea,input[type=text],select{font-family:var(--serif);font-size:16px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:8px 10px;width:100%;line-height:1.45}
textarea{resize:vertical;min-height:70px}
select{width:auto;max-width:100%;padding:5px 8px}
textarea:focus,input:focus,select:focus,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea:disabled,input:disabled,select:disabled{color:var(--muted);background:transparent}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;min-height:15px}
details.guide{margin:4px 0 6px;border-left:2px solid var(--accent);padding-left:12px}
details.guide summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--accent);letter-spacing:.03em;list-style:none}
details.guide summary::before{content:"+ "}
details.guide[open] summary::before{content:"\2212  "}
details.guide summary::-webkit-details-marker{display:none}
details.guide .g{font-size:15px;padding:6px 0 4px;max-width:70ch}
details.guide .g ul,details.guide .g ol{margin:4px 0 8px;padding-left:20px}
details.guide .g li{margin-bottom:3px}
.q{border-left:1px solid var(--rule);padding-left:12px;color:var(--muted);font-style:italic;margin:6px 0}
button{font-family:var(--mono);font-size:12px;padding:6px 11px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:2px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
button.pri{border-color:var(--accent);color:var(--accent)}
button.pri:hover{background:var(--accent);color:#fff}
button.x{border:0;color:var(--muted);padding:2px 6px}
button.x:hover{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.item{border:1px solid var(--rule);background:var(--sheet);padding:10px 12px;margin:8px 0}
.item .hd{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:6px}
.cites{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:8px}
.cites label{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block}
.cites input{font-size:14.5px;padding:5px 8px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--rule)}
.chk input{margin-top:6px;accent-color:var(--accent)}
.chk .d{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:92px;padding-top:3px}
.chk.done .t{color:var(--muted);text-decoration:line-through}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:12px 0}
.card{border:1px solid var(--rule);background:var(--sheet);padding:12px 14px}
.card b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:10px;padding:2px 8px;background:transparent;color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:hover{background:var(--accent-soft);color:var(--accent)}
.std{background:var(--sheet);border:1px solid var(--rule);padding:12px 14px;margin:8px 0}
.std p{max-width:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.tabs a{font-family:var(--mono);font-size:12px;padding:4px 10px;border:1px solid var(--rule);text-decoration:none;color:var(--ink);border-radius:2px}
.tabs a.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ssbody{max-height:420px;overflow:auto;border:1px solid var(--rule);background:var(--sheet);padding:4px 14px;margin-top:8px}
.sspage{border-bottom:1px solid var(--rule);padding:8px 0}
.sspage p{max-width:none;font-size:15.5px}
.note{border:1px solid var(--accent);background:var(--accent-soft);padding:10px 14px;margin:12px 0;font-size:15.5px;max-width:74ch}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;gap:0}
  nav{position:static;display:flex;flex-wrap:wrap;gap:2px 14px;padding:12px 0;border-bottom:1px solid var(--rule)}
  nav .grp{display:none}
  nav a{border-left:0;border-bottom:2px solid transparent;padding:3px 0}
  nav a.on{border-bottom-color:var(--accent)}
  .tile{border-right:0;border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">CAIS Accreditation Visit &middot; March 14&ndash;17, 2027 &middot; Confidential to the Visiting Team</div>
      <h1>The Country School Visiting Team Workspace</h1>
    </div>
    <div class="who" id="who"></div>
  </header>
  <div id="banner"></div>
  <section id="gate" hidden style="grid-column:1/-1;padding:30px 0 80px;max-width:560px"></section>
  <nav id="nav" aria-label="Workspace views"></nav>
  <main id="main"></main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const STANDARDS = /*STANDARDS*/[];
const VISIT_START = new Date(2027,2,14);
const TEAM = {
  cecee:{name:"Cecee",role:"Chair",lens:"Has held every administrative role at a small school; years on visiting committees."},
  tamar:{name:"Tamar",role:"Member",lens:"Academic program, middle school, faculty growth and evaluation."},
  amy:{name:"Amy",role:"Member",lens:"Early childhood, primary grades, community and family partnership."},
  jeff:{name:"Jeff",role:"Member",lens:"Finance, human resources, facilities, risk."},
  jim:{name:"Jim",role:"Member",lens:"Governance, enrollment, advancement, headship."}
};
const SECTIONS = [
  {n:1,rom:"I",title:"Institutional Purpose and Core Values",ch:[1],lead:"cecee"},
  {n:2,rom:"II",title:"Teaching and Learning",ch:[2,3,4,5,6,7],lead:"tamar"},
  {n:3,rom:"III",title:"Financial Sustainability",ch:[8,9,10],lead:"jim"},
  {n:4,rom:"IV",title:"Operations",ch:[11,12,13],lead:"jeff"},
  {n:5,rom:"V",title:"Institutional Stewardship and Leadership",ch:[14,15],lead:"jim"},
  {n:6,rom:"VI",title:"Institutional Improvement and Sustainability",ch:[16],lead:"cecee"}
];
const NA = {6:"The Country School is a day school, so the Residential Life standard should not apply. Confirm in the Portal."};
const PROPOSED = { // lead, second reader
  front:["cecee","jim"],1:["cecee","jim"],2:["tamar","amy"],3:["tamar","amy"],4:["tamar","cecee"],5:["amy","tamar"],7:["amy","tamar"],
  8:["jim","jeff"],9:["jeff","jim"],10:["jim","jeff"],11:["jeff","cecee"],12:["jeff","amy"],13:["amy","jeff"],14:["jim","cecee"],15:["cecee","jim"],16:["cecee","tamar"]
};
const STATUSES = ["Not started","Reading","Questions posted","Drafting","Ready for chair","Final"];
const RATINGS = ["","Highly effective","Effective","Somewhat effective","Minimally effective"];
const MILESTONES = [
 {ph:"Getting organized (now through winter break)"},
 {id:"m01",d:"Nov 20",who:"Chair",t:"Send the welcome note and the link to this workspace."},
 {id:"m02",d:"Dec 4",who:"Team",t:"Pick your name at the top of this page, mark the chapters you would like in Team and assignments, and read the Visiting Committee instructions (Reference)."},
 {id:"m03",d:"Dec 4",who:"Chair",t:"Agree on the team's AI plan with Holly Novick, including whether the school is comfortable with the self-study being used in non-training AI tools. Record it in AI guidelines."},
 {id:"m04",d:"Dec 11",who:"Chair",t:"Confirm chapter assignments here and assign chapters in the CAIS Accreditation Portal."},
 {id:"m05",d:"Dec 15",who:"School",t:"Self-study due in the Portal (date from the current CAIS protocol; confirm with the school)."},
 {id:"m06",d:"Dec 17",who:"All",t:"45-minute kickoff call: introductions, how this workspace works, calendar, questions."},
 {id:"m07",d:"Undated",who:"Team",t:"Attend a CAIS team member training session (dates are on the CAIS website)."},
 {ph:"Reading (January)"},
 {id:"m08",d:"Jan 8",who:"Team",t:"Log in to the Portal, open the self-study, and use Generate PDF so everyone cites the same page numbers."},
 {id:"m09",d:"Jan 29",who:"Team",t:"Read the whole self-study once. Put reading notes on your assigned chapters."},
 {id:"m10",d:"Jan 29",who:"Chair",t:"Check in with the Head and Self-Study Coordinator: draft schedule, private work room, computer and clerical support, housing and travel."},
 {ph:"Pre-writing (February)"},
 {id:"m11",d:"Feb 12",who:"Team",t:"Post written questions for each of your chapters: issues, concerns, clarifications, evidence to pursue on campus."},
 {id:"m12",d:"Feb 19",who:"Chair",t:"Share the draft visit schedule with the team."},
 {id:"m13",d:"Feb 26",who:"Team",t:"Draft context statements for your section and list tentative notable strengths. Ratings wait for the visit."},
 {id:"m14",d:"Mar 2",who:"All",t:"Second team call: trends in the self-study, concerns, who meets with whom on campus."},
 {id:"m15",d:"Mar 5",who:"Chair",t:"Final logistics note: first meeting time, hotel, travel, and a reminder to bring a card or cash for reimbursable expenses."},
 {ph:"The visit (Sunday March 14 to Wednesday March 17)"},
 {id:"m16",d:"Mar 14",who:"All",t:"Arrive. Orientation meeting before the first meeting with the school."},
 {id:"m17",d:"Mar 15–16",who:"All",t:"Meetings, classroom visits, evening drafting. Strengths, recommendations, ratings and rationales drafted by Tuesday night."},
 {id:"m18",d:"Mar 16–17",who:"All",t:"Review all 16 standards together. Discuss and vote on the recommended status. This happens in the room and in the Portal, never in this workspace."},
 {id:"m19",d:"Mar 17",who:"Chair",t:"Preview the report with the Head, revise, present to the school community, and leave. No copy of the report stays at the school."},
 {ph:"After the visit"},
 {id:"m20",d:"Mar 19",who:"Team",t:"Send expense vouchers to the school."},
 {id:"m21",d:"Mar 27",who:"Chair",t:"Submit the final report and the confidential Recommendation for Status of Accreditation in the Portal (due within 10 days of the visit)."},
 {id:"m22",d:"Mar 27",who:"Chair",t:"Complete the CAIS AI use form."}
];
const SCHED_DEFAULT = {
 sun:"3:00  Team arrives at the hotel\n3:30  Orientation meeting: purpose of the visit, how status is decided, trends in the self-study, how we gather evidence, review of the schedule\n5:00  Dinner",
 mon:"7:45  Breakfast with faculty\n8:15  Watch arrival\n9:00  Campus tour\n11:00 Team work time\n12:00 Working lunch in pairs: students, parents\n1:00  Section II groups / Section III groups (finance, development, admission)\n3:00  Head of School\n3:45  Steering Committee\n5:00  Working dinner and drafting",
 tue:"7:30  Breakfast with the Board\n8:30  Team work time and classroom visits\n10:30 Technology and library; admission\n12:00 Working lunch with preschool and lower school faculty\n1:10  Staff\n1:40  Team work time\n3:15  Middle school faculty\n4:00  Any remaining groups (Sections IV, V, VI)\n6:00  Working dinner. Finish drafts, review the 16 standards.",
 wed:"Morning  Finish the report\n11:30 Chair previews the report with the Head (ratings and rationales are read to the Head)\n1:30  Team revises as needed\n3:45  Presentation to the school community, then the team exits"
};
const RATING_DEF = `<ul>
<li><b>Highly effective:</b> The self-study and visit provide evidence that the school is meeting the standard in a way that has resulted in a highly positive impact on student learning, the school’s program, and the school’s operation.</li>
<li><b>Effective:</b> … in a way that has resulted in a satisfactory level of impact on student learning, the school’s program, and the school’s operation.</li>
<li><b>Somewhat effective:</b> … in a way that has resulted in limited positive impact on student learning, the school’s program, and the school’s operation.</li>
<li><b>Minimally effective:</b> The school is seriously struggling to meet the standard, and its actions have resulted or could result in little or no positive impact, and possibly even in a negative impact, on student learning, the school’s program, and the school’s operation.</li></ul>`;
const AI_HUMAN = '<span class="pill warn" title="CAIS 2026 Visiting Team AI Guidelines">Written by you, not AI</span>';
const AI_ASSIST = '<span class="pill ok" title="CAIS 2026 Visiting Team AI Guidelines">AI may help summarize; you verify against the source</span>';
const G = {
 commentary:`<p>The school’s own profile is pre-populated in the Portal exactly as the school wrote it. This box is the team’s commentary on it.</p><ul><li>Add information and observations the profile leaves out, such as growth or significant changes.</li><li>Keep it basically factual.</li><li>Do not repeat what the profile already says.</li><li>Length in the CAIS sample: three short paragraphs.</li></ul>`,
 progress:`<p>Discuss the significant changes and the progress made on the previous major recommendations since the last self-study. The point is to evaluate how the school used its self-study and major recommendations through the cycle.</p><ul><li>Pay particular attention to how each major recommendation was addressed since the midterm report.</li><li>The school must respond substantively to every major recommendation. It is expected, but not required, to implement each one. If it chose not to, it should give reasons.</li><li>Note any recommendation that was minimally addressed and say whether this report will repeat it.</li><li>Format used in the CAIS sample: an opening summary, then each prior recommendation quoted with its citation, followed by a short paragraph on progress.</li></ul>`,
 process:`<p>Rate how effective the school was in promoting breadth of involvement and collaboration within the full school community in creating the self-study, then explain the rating and summarize the evidence.</p><ul><li><b>Highly effective:</b> a very high degree of broad involvement and collaboration.</li><li><b>Effective:</b> a satisfactory degree.</li><li><b>Somewhat effective:</b> a limited degree.</li><li><b>Minimally effective:</b> largely unsuccessful in securing even a minimal degree.</li></ul><p>Name which constituencies took part (faculty, staff, administration, trustees, parents, students, alumni) and which did not.</p>`,
 context:`<p>Opens the section and gives readers the background on the school’s efforts in this area. Generally one or two succinct paragraphs.</p><ul><li>Identify the important issues the school is facing or will face, as opportunities, challenges, or both.</li><li>Pinpoint and articulate the issues. It is not the team’s role to prescribe solutions.</li><li>You may include a few guiding questions for the school’s further self-reflection. They are non-binding: the school does not have to use them or report back.</li></ul><p><b>AI rule:</b> if you use AI to summarize, you are responsible for checking every statement against the self-study and what you saw. No file with a student’s or employee’s name or image goes into any AI tool.</p>`,
 strengths:`<p>Record the school’s major strengths for this section, each with a brief explanation.</p><ul><li>Only the notable ones: typically one to four per section, and generally fewer than 15 in the whole report.</li><li>Favor strengths that will help the school navigate its future.</li><li>CAIS sample format: one paragraph per strength. The first sentence names the strength, the rest gives the evidence.</li><li>Reports no longer contain commendations.</li></ul>`,
 recs:`<p>Recommendations for future work in this section. Mark a few as major.</p><ul><li>Per section: single figures. Major recommendations in the whole report: typically four to eight.</li><li>Do not be prescriptive. Name who should act and what needs attention, and leave the how to the school.</li><li>CAIS sample wording begins <i>“That the [Board / Head / faculty and administration] …”</i></li><li>Document every recommendation with <b>at least two</b> of these, in this order: (1) CAIS standards, institutional goals, school publications; (2) self-study page numbers from the Portal PDF; (3) conferences, naming groups and never individuals; (4) observations.</li></ul><div class="q">Sample: That the Board of Trustees, Head of School, and Business Manager immediately collaborate to develop a credible balanced budget for the coming year … (Standards 8 and 9; self-study pp. 75–77, 83–84; interviews with Finance Committee and administrative team)</div>`,
 rating:`<p>How effective is the school in meeting the standard? The rating is part of the report and will be seen by the school.</p>${RATING_DEF}`,
 rationale:`<p>Every rating needs a statement of rationale that explains the committee’s reasoning and summarizes the evidence it used. Tie it to the standard’s language and indicators, the self-study (with page numbers), and what the team heard and saw.</p>`,
 notes:`<p>Working notes for the two of you on this chapter. Self-study page numbers, things to verify, baseline requirements the school answered “no” to. Nothing here goes into the report unless you move it. Use group names (“middle school faculty”), never the names of students or employees.</p>`,
 questions:`<p>Before the visit the chair asks each member for written questions about issues, concerns, clarifications, and evidence that should be pursued on campus. One question per row, and say which group can answer it (trustees, faculty, parents, students, business office).</p>`
};
/* ---------- state ---------- */
let db=null,user=null,isOwner=false,canWrite=true,connected=false;
const S={fields:{},items:{},assign:{},plan:{},status:{},prefs:{}};
let me=null;
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const std=n=>STANDARDS.find(s=>s.n===n);
const first=k=>TEAM[k]?TEAM[k].name.split(" ")[0]:"";
const assignOf=k=>{const a=S.assign[k];const p=PROPOSED[k]||["",""];return a?{lead:a.lead||"",reader:a.reader||"",saved:true}:{lead:p[0],reader:p[1],saved:false}};
const statusOf=n=>(S.status[n]&&S.status[n].s)||STATUSES[0];
const fval=(col,id)=>{const d=(col==="c_plan"?S.plan:S.fields)[id];return d&&typeof d.t==="string"?d.t:null};
const itemsOf=(kind,key,val)=>Object.entries(S.items).filter(([,v])=>v.kind===kind&&(key?v[key]===val:true)).sort((a,b)=>(a[1].at||0)-(b[1].at||0));
const when=t=>t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):"";
function banner(msg){$("#banner").textContent=msg||""}
/* ---------- writes ---------- */
const chain={};
function write(path,data,del){
  if(!db){banner("Not connected to the shared workspace, so this change is not saved. Sign in again and retry.");return Promise.resolve()}
  const run=()=> (del?db.doc(path).delete():db.doc(path).set(data)).catch(e=>{
    if(e&&e.code==="permission-denied"){banner("That change was not saved. Only the chair can edit this part, or your sign-in has expired.")}
    else banner("A change could not be saved ("+((e&&e.code)||"error")+"). Keep this tab open and try the edit again.");
  });
  chain[path]=(chain[path]||Promise.resolve()).then(run);return chain[path];
}
const timers={};
function saveField(el){
  const col=el.dataset.col||"fields", id=el.dataset.f, v=el.value;
  if(fval(col,id)===v||(fval(col,id)===null&&v===(el.dataset.def||""))) return;
  write(col+"/"+id,{t:v,by:me||"",at:Date.now()});
}
function saveItemKey(el){
  const id=el.dataset.item,k=el.dataset.k,cur=S.items[id]; if(!cur) return;
  const v=el.type==="checkbox"?el.checked:el.value; if(cur[k]===v) return;
  const next=Object.assign({},cur,{[k]:v,by:me||cur.by||"",at:cur.at}); S.items[id]=next; write("items/"+id,next);
}
function addItem(o){ if(!db){banner("Not connected, so nothing can be added yet.");return}
  db.collection("items").add(Object.assign({text:"",by:me||"",at:Date.now()},o)).catch(()=>banner("Could not add the row. Try again.")) }
/* ---------- components ---------- */
function guide(key,label){return `<details class="guide"><summary>${label||"What goes here, and how to format it"}</summary><div class="g">${G[key]}</div></details>`}
function field(id,o){
  const col=o.col||"fields", saved=fval(col,id), v=saved===null?(o.def||""):saved, d=(col==="c_plan"?S.plan:S.fields)[id];
  const dis=(o.chair&&!isOwner)||!canWrite?" disabled":"";
  const meta=d?`Saved ${when(d.at)}${d.by&&TEAM[d.by]?" by "+first(d.by):""}`:(o.def?"Draft starting point, not yet saved":"");
  return `<div class="fld"><div class="row"><label for="f-${id}">${o.label}</label>${o.ai||""}${o.chair?'<span class="pill">Chair edits</span>':""}</div>${o.guide?guide(o.guide):""}
  <textarea id="f-${id}" data-f="${id}" data-col="${col}" data-def="${esc(o.def||"")}" rows="${o.rows||5}" placeholder="${esc(o.ph||"")}"${dis}>${esc(v)}</textarea><div class="meta" data-meta="${id}">${meta}</div></div>`;
}
function selectField(id,label,opts,guideKey){
  const v=fval("fields",id)||"";
  return `<div class="fld"><div class="row"><label for="f-${id}">${label}</label>${AI_HUMAN}</div>${guideKey?guide(guideKey,"Rating definitions"):""}
  <select id="f-${id}" data-f="${id}"${canWrite?"":" disabled"}>${opts.map(o=>`<option${o===v?" selected":""} value="${esc(o)}">${o||"Not yet rated"}</option>`).join("")}</select></div>`;
}
function personSelect(attrs,val,dis){return `<select ${attrs}${dis?" disabled":""}><option value="">Unassigned</option>${Object.keys(TEAM).map(k=>`<option value="${k}"${k===val?" selected":""}>${first(k)}</option>`).join("")}</select>`}
function itemText(id,v,k,rows,ph){return `<textarea data-item="${id}" data-k="${k}" rows="${rows}" placeholder="${esc(ph)}"${canWrite?"":" disabled"}>${esc(v[k]||"")}</textarea>`}
function citeCount(v){return ["c1","c2","c3","c4"].filter(k=>(v[k]||"").trim()).length}
function recText(v){const c=[v.c1&&"Standards "+v.c1,v.c2&&"self-study pp. "+v.c2,v.c3,v.c4].filter(Boolean).join("; ");return (v.text||"").trim()+(c?" ("+c+")":"")}
/* ---------- views ---------- */
const VIEWS=[["","Start here"],["overview","Overview"],["plan","Plan and deadlines"],["team","Team and assignments"],["","Write"],["front","Front matter"],["section-1","I. Purpose and Values"],["section-2","II. Teaching and Learning"],["section-3","III. Financial Sustainability"],["section-4","IV. Operations"],["section-5","V. Stewardship and Leadership"],["section-6","VI. Improvement"],["majors","Major recommendations"],["questions","Questions for the visit"],["selfstudy","Self-study"],["","Visit"],["schedule","Visit schedule"],["ai","AI guidelines"],["reference","Reference"]];
function route(){const h=location.hash.replace("#","");return VIEWS.some(v=>v[0]===h&&h)?h:"overview"}
function renderNav(){const r=route();$("#nav").innerHTML=VIEWS.map(([h,t])=>h?`<a href="#${h}"${h===r?' class="on" aria-current="page"':""}>${t}</a>`:`<div class="grp">${t}</div>`).join("")}
function chapterRows(filterMine){
  return SECTIONS.map(sec=>{
    const rows=sec.ch.map(n=>{const s=std(n);if(NA[n])return filterMine?"":`<tr class="na"><td class="num">${n}</td><td>${esc(s.title)}</td><td colspan="4">Not applicable (day school)</td></tr>`;
      const a=assignOf(n); if(filterMine&&a.lead!==me&&a.reader!==me) return "";
      const st=statusOf(n), r=fval("fields","ch"+n+".rating"), q=itemsOf("question","ch",n).length;
      return `<tr><td class="num">${n}</td><td><a href="#section-${sec.n}">${esc(s.title)}</a></td><td>${first(a.lead)||"—"}${a.saved?"":' <span class="pill">proposed</span>'}</td><td>${first(a.reader)||"—"}</td><td><span class="pill ${st==="Final"?"ok":st==="Not started"?"":"go"}">${st}</span></td><td class="num">${q||""}${r?' <span class="pill ok">rated</span>':""}</td></tr>`}).join("");
    return rows?`<tr class="sec"><td colspan="6">Section ${sec.rom}: ${sec.title}</td></tr>`+rows:"";
  }).join("");
}
const chTable=(mine)=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Ch.</th><th>Standard</th><th>Lead writer</th><th>Second reader</th><th>Status</th><th>Questions</th></tr></thead><tbody>${chapterRows(mine)}</tbody></table></div>`;

  <h3>Next on the calendar</h3>${next.map(m=>`<div class="chk"><span class="d">${m.d}</span><span class="t"><span class="pill">${m.who}</span> ${m.t}</span></div>`).join("")}<p class="small" style="margin-top:8px"><a href="#plan">Full plan and deadlines</a></p>

}

   ${itemText(id,v,"text",3,"That the …")}
   <div class="cites"><div><label>1. Standards / school documents</label><input type="text" data-item="${id}" data-k="c1" value="${esc(v.c1||"")}" placeholder="8 and 9"></div><div><label>2. Self-study pages</label><input type="text" data-item="${id}" data-k="c2" value="${esc(v.c2||"")}" placeholder="75–77, 83–84"></div><div><label>3. Conferences (groups only)</label><input type="text" data-item="${id}" data-k="c3" value="${esc(v.c3||"")}" placeholder="interviews with Finance Committee"></div><div><label>4. Observations</label><input type="text" data-item="${id}" data-k="c4" value="${esc(v.c4||"")}" placeholder="classroom visits in grades 3–5"></div></div></div>`}).join("")}

function vAI(){
  const log=itemsOf("ailog");
  return `<h2>AI guidelines for this team</h2><p class="lede">CAIS is piloting AI guidelines for 2026 visiting teams and asks that teams not deviate from them. This page holds the rules, the plan the chair agrees with the Head of The Country School, and a log that feeds the AI use form CAIS asks for.</p>
  <h3>The rules, in short</h3><ul>
  <li><b>Human, AI, human.</b> Work begins with a person’s question and ends with a person’s reflection and judgment. AI may support synthesis, organization, or pattern recognition. Evaluative judgment, contextual interpretation, and final conclusions stay fully human.</li>
  <li><b>Non-training tools only.</b> Use only AI tools that do not store, reuse, or learn from what you enter. CAIS gives Gemini for Education, ChatGPT Plus or higher, Claude Pro or Team, and Flint as examples.</li>
  <li><b>A plan agreed with the Head.</b> The team settles how AI will or will not be used in consultation with the Head of the school, asks explicitly whether the school is comfortable with the self-study being used in non-training tools, and is transparent about the uses.</li>
  <li><b>No identifying material.</b> No attachment, resource, or exhibit containing student-identifying information goes into any AI tool, whatever its training status. That includes any file with students’ or employees’ names or images.</li>
  <li><b>Context statements:</b> if you use AI, you verify the summary against the original source material.</li>
  <li><b>Ratings, rationales, notable strengths, recommendations:</b> written by team members. Not generated by AI.</li>
  <li><b>AI use form:</b> completed for the CAIS AI Task Force.</li></ul>
  <p class="small">Every writing box in this workspace carries one of two labels that restate which rule applies to it. This workspace has no AI features built into it; it only stores what the team types.</p>
  <h3>Our plan</h3>
  ${field("ai_school",{col:"c_plan",label:"What the Head of The Country School agreed to",chair:true,rows:4,ph:"Date of the conversation. Is the school comfortable with the self-study being used in non-training tools? Any limits."})}
  ${field("ai_plan",{col:"c_plan",label:"How this team will and will not use AI",chair:true,rows:6,ph:"Permitted: summarizing self-study chapters for context statements, organizing notes. Not permitted: ratings, rationales, strengths, recommendations, any upload containing names or images."})}
  <h3>AI use log <span class="pill">${log.length}</span></h3><p class="small">One line each time you use an AI tool for this visit. It takes ten seconds and makes the CAIS form easy to complete.</p>
  ${log.map(([id,v])=>`<div class="item"><div class="cites" style="margin-top:0;grid-template-columns:1fr 2fr 1fr auto;align-items:end"><div><label>Tool${v.by&&TEAM[v.by]?" · "+first(v.by):""}</label><input type="text" data-item="${id}" data-k="c1" value="${esc(v.c1||"")}" placeholder="Claude Team"></div><div><label>What for</label><input type="text" data-item="${id}" data-k="text" value="${esc(v.text||"")}" placeholder="Summarized ch. 9 narrative for context statement"></div><div><label>How I verified</label><input type="text" data-item="${id}" data-k="c2" value="${esc(v.c2||"")}" placeholder="Checked against pp. 60–68"></div><button class="x" data-del="${id}">Delete</button></div></div>`).join("")}
  <button data-add="ailog">Add a log line</button>`;
}
function vReference(){

  <h3>Shape of the report</h3><ol><li>Confirmation of adherence to CAIS policies</li><li>Introduction: the school’s profile (pre-populated) and the team’s commentary</li><li>Assessment of the progress report</li><li>Comments on the self-study process, with a rating</li><li>Six sections covering the 16 standards. Each has a context statement, notable strengths, recommendations, and a rating with rationale per chapter.</li><li>Summary of major recommendations (auto-populated in the Portal)</li><li>Confidential Documentation and Justification Statement</li></ol>
  <h3>Rating scale for the 16 standards</h3>${RATING_DEF}
  <h3>Working rules</h3><ul><li>Relate every discussion to the standards.</li><li>Do not be prescriptive. Identify the issue and leave the solution to the school.</li><li>Cite groups, never individuals.</li><li>See a reasonable number of classrooms and make sure no evidence is overlooked.</li><li>The school gets a chance to ask questions before the final draft.</li><li>Do not leave a copy of the report at the school or give it to anyone there.</li><li>Keep copies of all documents and treat them confidentially.</li></ul>
  <h3>The recommended status of accreditation</h3><p>The team reviews all 16 standards, discusses, and votes. The chair records the recommendation, the vote, the options considered, and the rationale in the confidential form in the Portal, with member signatures. It must line up with the report. The committee does not imply the status to anyone at the school or answer questions about it. The CAIS Board of Standards reviews the report and recommends a status to the CAIS Board of Directors, which decides.</p>
  <p>The options: seven years with a mid-cycle progress report; seven years with a mid-cycle report and a one-day visit (with or without additional requirements); two years with an in-depth report and one-day visit; one year with an in-depth report and one-day visit; denial.</p>
  <div class="note">None of that is written in this workspace. There is deliberately no box for it.</div>
  <h3>The readout</h3><p>The presentation follows the six sections. For each: the context statement, at least one notable strength, and the major recommendations. Ratings and the recommended status are left out. Before it, the chair meets the Head to preview the report and reads the chapter ratings and rationales to the Head. The audience is told the report is a draft that may change, that it is confidential, and that recording is prohibited.</p>
  <h3>After the visit</h3><ul><li>Expense vouchers go to the school.</li><li>Final report and confidential recommendation are submitted in the Portal within 10 days: by March 27, 2027.</li><li>Do not share a copy with the school.</li></ul>`;
}

let SS=null,ssSub=false;const ssOpen={},ssView={a:"",b:""};
function ssStart(){ if(ssSub||!db) return; ssSub=true; db.collection("selfstudy").onSnapshot(s=>{SS={};s.docs.forEach(d=>{const v=d.data();SS[v.n]=v.t});ssFill();if(route()==="selfstudy"&&!editing())render()},()=>{SS={}}) }
function ssPages(a,b){
  if(!SS) return '<p class="small">Loading the self-study\u2026</p>';
  const ns=Object.keys(SS).map(Number).sort((x,y)=>x-y);
  if(!ns.length) return '<p class="small">The self-study has not been uploaded yet. The chair adds it on the Self-study page once the school submits it.</p>';
  a=parseInt(a,10)||0; b=parseInt(b,10)||a;
  if(!a) return '<p class="small">Enter the first and last page above to show that part of the self-study here. The range is shared with the team.</p>';
  return ns.filter(n=>n>=a&&n<=b).map(n=>`<div class="sspage"><div class="mono">p. ${n}</div><p>${esc(SS[n]).replace(/\n/g,"<br>")}</p></div>`).join("")||'<p class="small">No pages in that range.</p>';
}
function ssBlock(key,label){
  const a=fval("fields",key+".ssa")||"",b=fval("fields",key+".ssb")||"";
  return `<details class="guide" data-ss="${key}"${ssOpen[key]?" open":""}><summary>Self-study: ${label}</summary><div class="g"><div class="cites" style="grid-template-columns:120px 120px;margin-top:2px"><div><label for="f-${key}.ssa">First page</label><input type="text" id="f-${key}.ssa" data-f="${key}.ssa" inputmode="numeric" value="${esc(a)}"></div><div><label for="f-${key}.ssb">Last page</label><input type="text" id="f-${key}.ssb" data-f="${key}.ssb" inputmode="numeric" value="${esc(b)}"></div></div><div class="ssbody" data-ssbody="${key}">${ssOpen[key]?ssPages(a,b):""}</div></div></details>`;
}
function ssFill(){ $$("[data-ssbody]").forEach(el=>{const k=el.dataset.ssbody; if(ssOpen[k]) el.innerHTML=ssPages(fval("fields",k+".ssa"),fval("fields",k+".ssb"))}); const v=$("#ss-view"); if(v) v.innerHTML=ssPages(ssView.a,ssView.b) }
function vSelfStudy(){
  ssStart(); const n=SS?Object.keys(SS).length:0;
  return `<h2>Self-study</h2><p class="lede">The text of the school\u2019s self-study, so each chapter can be read beside the team\u2019s notes. Page numbers follow the PDF generated in the Portal, so citations match. Text only: photos, charts, and attached exhibits stay in the Portal.</p>

  <h3>Read by page</h3><div class="cites" style="grid-template-columns:120px 120px auto;align-items:end"><div><label for="ss-a">First page</label><input type="text" id="ss-a" inputmode="numeric" value="${esc(ssView.a)}"></div><div><label for="ss-b">Last page</label><input type="text" id="ss-b" inputmode="numeric" value="${esc(ssView.b)}"></div><div><button id="ss-show">Show pages</button></div></div>

const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",PDFW="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
async function ssUpload(file,msg){
  msg("Reading the PDF\u2026");
  if(!window.pdfjsLib){await new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=PDFJS;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW}
  const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pages=[];
  for(let i=1;i<=pdf.numPages;i++){const c=await (await pdf.getPage(i)).getTextContent();pages.push(c.items.map(it=>it.str+(it.hasEOL?"\n":"")).join("").replace(/[ \t]+\n/g,"\n").trim());if(i%10===0)msg("Read "+i+" of "+pdf.numPages+" pages\u2026")}
  msg("Saving "+pages.length+" pages\u2026");
  const old=await db.collection("selfstudy").get(),ops=[];
  old.docs.forEach(d=>ops.push(["del",d.ref]));
  pages.forEach((t,i)=>ops.push(["set",db.doc("selfstudy/p"+String(i+1).padStart(4,"0")),{n:i+1,t:t.slice(0,900000)}]));
  for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(o=>o[0]==="del"?b.delete(o[1]):b.set(o[1],o[2]));await b.commit()}
  msg("Saved "+pages.length+" pages. Check a page or two against the Portal PDF.");
}

  else if(el.matches("input[type=checkbox][data-item]")) saveItemKey(el);

main.addEventListener("click",e=>{const el=e.target.closest("button,a[data-jump]"); if(!el) return;
  if(el.dataset.jump){e.preventDefault();const t=document.getElementById(el.dataset.jump);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(el.dataset.add){const o={kind:el.dataset.add};if(el.dataset.sec)o.sec=+el.dataset.sec;if(el.dataset.ch)o.ch=+el.dataset.ch;addItem(o)}
  else if(el.dataset.del){ if(el.dataset.sure){write("items/"+el.dataset.del,null,true)} else {el.dataset.sure="1";el.textContent="Click again to delete";setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent="Delete"}},4000)} }
  else if(el.id==="ss-show"){ssView.a=$("#ss-a").value;ssView.b=$("#ss-b").value;ssFill()}
  else if(el.id==="ss-go"){const f=$("#ss-file").files[0],m=t=>{const x=$("#ss-msg");if(x)x.textContent=t};if(!f){m("Choose the PDF first.");return}el.disabled=true;ssUpload(f,m).catch(()=>m("The upload did not finish. Check the file is a PDF and try again.")).then(()=>{if(el.isConnected)el.disabled=false})}
  else if(el.dataset.pref&&me){const n=+el.dataset.pref;let ch=((S.prefs[me]&&S.prefs[me].ch)||[]).slice();ch=ch.includes(n)?ch.filter(x=>x!==n):ch.concat(n);S.prefs[me]={ch};write("prefs/"+me,{ch,at:Date.now()});render()}
  else if(el.dataset.copysec){const txt=sectionText(+el.dataset.copysec);navigator.clipboard.writeText(txt).then(()=>{el.textContent="Copied"},()=>{el.textContent="Copy was blocked by the browser"});setTimeout(()=>{if(el.isConnected)el.textContent="Copy this section for the Portal"},2500)}
});
function sectionText(n){const sec=SECTIONS[n-1],L=[];
  L.push("SECTION "+sec.rom+": "+sec.title.toUpperCase(),"","CONTEXT STATEMENT",fval("fields","sec"+n+".context")||"","","NOTABLE STRENGTHS");
  itemsOf("strength","sec",n).forEach(([,v],i)=>L.push((i+1)+". "+(v.text||"")));
  L.push("","RECOMMENDATIONS"); itemsOf("rec","sec",n).forEach(([,v],i)=>L.push((i+1)+". "+(v.major?"[MAJOR] ":"")+recText(v)));
  sec.ch.filter(c=>!NA[c]).forEach(c=>L.push("","STANDARD "+c+": "+std(c).title,"Rating: "+(fval("fields","ch"+c+".rating")||"not yet rated"),"Rationale: "+(fval("fields","ch"+c+".rationale")||"")));
  return L.join("\n");
}
